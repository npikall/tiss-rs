[package]
name = "tiss-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossterm = "0.29"
dirs = "7.0.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rusqlite = { version = "0.41.1", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "tiss"
path = "src/main.rs"

[target.'cfg(unix)'.dev-dependencies]
rexpect = "0.7.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Step 1: no explicit panics. Tests are exempt via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# Step 2: no panicking indexing or slicing, of slices or of strings.
indexing_slicing = "deny"
string_slice = "deny"
# Step 3: no overflow panics, which debug builds and chrono operators raise.
arithmetic_side_effects = "deny"
