[package]
name = "tiss-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "tiss"
path = "src/main.rs"
